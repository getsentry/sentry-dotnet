version: 2
updates:
- package-ecosystem: "dotnet-sdk"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 1

- package-ecosystem: nuget
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
  allow:
    - dependency-name: "UnoptimizedAssemblyDetector"
    - dependency-name: "Roslynator.Analyzers"

- package-ecosystem: nuget
  directory: "/benchmarks"
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
  allow:
    - dependency-name: "BenchmarkDotNet*"
  groups:
    benchmarkdotnet:
      patterns:
        - "BenchmarkDotNet*"

- package-ecosystem: nuget
  directory: "/samples"
  schedule:
    interval: monthly
  open-pull-requests-limit: 2

- package-ecosystem: nuget
  directory: "/src"
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
  allow:
    - dependency-name: "SIL.ReleaseTasks"

- package-ecosystem: nuget
  directory: "/test"
  schedule:
    interval: weekly
  open-pull-requests-limit: 2

- package-ecosystem: "github-actions"
  directories:
    - "/"
    - "/.github/actions/*"
  schedule:
    interval: weekly
  # Dependabot treats each subpath of an action repo as a separate dependency, so
  # without these groups it bumps e.g. codeql-action/init without codeql-action/analyze
  # and the mismatched versions break CI. Group each repo so subpaths move in lockstep.
  groups:
    codeql-action:
      patterns:
        - "github/codeql-action*"
    github-workflows:
      patterns:
        - "getsentry/github-workflows*"
    craft:
      patterns:
        - "getsentry/craft*"
    actions-cache:
      patterns:
        - "actions/cache*"
