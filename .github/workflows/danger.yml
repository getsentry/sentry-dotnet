name: Danger

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  danger:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: getsentry/github-workflows/danger@36529d71129a14967bea1fb81bcaf2a5943cf877 # 3.5.0
