name: build

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# While we track a .NET preview or RC, the runtime-deps tag the SDK derives from the runtime
# version doesn't exist yet, so the container integration tests have to be told which image to
# use. Which runtimes need pinning varies by release: for .NET 10 it was only linux-musl, for
# .NET 11 the glibc runtimes need it too because the images moved from noble to resolute.
#
# At GA, blank these two values - do NOT delete them or the steps that use them. They are needed
# again for every subsequent preview. An empty value is ignored (see integration-test/aot.Tests.ps1),
# so the SDK goes back to deriving the tag itself.
#
# See CONTRIBUTING.md -> "Upgrading to a new .NET major version".
env:
  CONTAINER_BASE_IMAGE_GLIBC: 'mcr.microsoft.com/dotnet/runtime-deps:11.0-preview-resolute-chiseled'
  CONTAINER_BASE_IMAGE_MUSL: 'mcr.microsoft.com/dotnet/runtime-deps:11.0-preview-alpine'

jobs:
  build-sentry-native:
    name: sentry-native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: ubuntu-latest
            rid: linux-musl-x64
            container:
              image: ghcr.io/getsentry/sentry-dotnet-alpine:3.21
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
            container:
              image: ghcr.io/getsentry/sentry-dotnet-alpine:3.21
              volumes:
                - /tmp/node20:/__e/node20
                - /tmp/node24:/__e/node24
          - os: xcode-27 # Pin macos to get the version of Xcode that we need: https://github.com/actions/runner-images/issues/10703
            rid: macos # universal (osx-arm64 + osx-x64)
          - os: windows-2025-vs2026
            rid: win-x64
          - os: windows-11-vs2026-arm
            rid: win-arm64

    steps:
      - name: Initialize Alpine Linux
        if: ${{ contains(matrix.container.image, 'alpine') }}
        # Enable JavaScript Actions in Alpine containers on Arm64 runners
        # See https://github.com/getsentry/sentry-dotnet/pull/5455
        run: |
          if [ "$(uname -m)" != "x86_64" ]; then
            for node in /__e/node*; do
              sudo mkdir -p "$node/bin"
              sudo ln -s /usr/bin/node "$node/bin/node"
              sudo ln -s /usr/bin/npm "$node/bin/npm"
            done
            sudo sed -i 's/ID=alpine/ID=unknown/' /usr/lib/os-release
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: git submodule update --init modules/sentry-native

      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Sentry/Platforms/Native/sentry-native
          key: sentry-native-${{ matrix.rid }}-${{ hashFiles('scripts/build-sentry-native.ps1') }}-${{ hashFiles('.git/modules/modules/sentry-native/HEAD') }}
          enableCrossOsArchive: true

      - run: scripts/build-sentry-native.ps1
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh

  build-sentry:
    needs: build-sentry-native
    name: .NET (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            slnf: Sentry-CI-Build-Linux.slnf
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            slnf: Sentry-CI-Build-Linux-NoMobile.slnf
          - os: ubuntu-latest
            rid: linux-musl-x64
            slnf: Sentry-CI-Build-Linux-NoMobile.slnf
            container:
              image: ghcr.io/getsentry/sentry-dotnet-alpine:3.21
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
            slnf: Sentry-CI-Build-Linux-NoMobile.slnf
            container:
              image: ghcr.io/getsentry/sentry-dotnet-alpine:3.21
              volumes:
                - /tmp/node20:/__e/node20
                - /tmp/node24:/__e/node24
                - /var/run/docker.sock:/var/run/docker.sock
          - os: xcode-27 # Pin macos to get the version of Xcode that we need: https://github.com/actions/runner-images/issues/10703
            rid: macos # universal (osx-arm64 + osx-x64)
            slnf: Sentry-CI-Build-macOS.slnf
          # .NET 10+ Native AOT requires VS 2026 (https://github.com/dotnet/runtime/issues/133835)
          - os: windows-2025-vs2026
            rid: win-x64
            slnf: Sentry-CI-Build-Windows.slnf
          - os: windows-11-vs2026-arm
            rid: win-arm64
            slnf: Sentry-CI-Build-Windows-arm64.slnf

    steps:
      - name: Initialize Alpine Linux
        if: ${{ contains(matrix.container.image, 'alpine') }}
        # Enable JavaScript Actions in Alpine containers on Arm64 runners
        # See https://github.com/getsentry/sentry-dotnet/pull/5455
        run: |
          if [ "$(uname -m)" != "x86_64" ]; then
            for node in /__e/node*; do
              sudo mkdir -p "$node/bin"
              sudo ln -s /usr/bin/node "$node/bin/node"
              sudo ln -s /usr/bin/npm "$node/bin/npm"
            done
            sudo sed -i 's/ID=alpine/ID=unknown/' /usr/lib/os-release
          fi

      - name: Cancel Previous Runs
        if: github.ref_name != 'main' && !startsWith(github.ref_name, 'release/')
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 2 # default is 1 and codecov needs > 1

      - name: Remove unused applications
        if: ${{ !matrix.container }}
        uses: ./.github/actions/freediskspace

      - name: Setup Environment
        uses: ./.github/actions/environment
        with:
          projects: ${{ matrix.slnf }}

      # We use macOS for the final publishing build so we get all the iOS/macCatalyst targets in the packages
      - name: Set Environment Variables
        if: runner.os == 'macOS'
        run: echo "CI_PUBLISHING_BUILD=true" >> $GITHUB_ENV

      - name: Download sentry-native (linux-x64)
        if: ${{ (env.CI_PUBLISHING_BUILD == 'true') || (matrix.rid == 'linux-x64') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Sentry/Platforms/Native/sentry-native
          key: sentry-native-linux-x64-${{ hashFiles('scripts/build-sentry-native.ps1') }}-${{ hashFiles('.git/modules/modules/sentry-native/HEAD') }}
          fail-on-cache-miss: true

      - name: Download sentry-native (linux-arm64)
        if: ${{ (env.CI_PUBLISHING_BUILD == 'true') || (matrix.rid == 'linux-arm64') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Sentry/Platforms/Native/sentry-native
          key: sentry-native-linux-arm64-${{ hashFiles('scripts/build-sentry-native.ps1') }}-${{ hashFiles('.git/modules/modules/sentry-native/HEAD') }}
          fail-on-cache-miss: true

      - name: Download sentry-native (linux-musl-x64)
        if: ${{ (env.CI_PUBLISHING_BUILD == 'true') || (matrix.rid == 'linux-musl-x64') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Sentry/Platforms/Native/sentry-native
          key: sentry-native-linux-musl-x64-${{ hashFiles('scripts/build-sentry-native.ps1') }}-${{ hashFiles('.git/modules/modules/sentry-native/HEAD') }}
          fail-on-cache-miss: true

      - name: Download sentry-native (linux-musl-arm64)
        if: ${{ (env.CI_PUBLISHING_BUILD == 'true') || (matrix.rid == 'linux-musl-arm64') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Sentry/Platforms/Native/sentry-native
          key: sentry-native-linux-musl-arm64-${{ hashFiles('scripts/build-sentry-native.ps1') }}-${{ hashFiles('.git/modules/modules/sentry-native/HEAD') }}
          fail-on-cache-miss: true

      - name: Download sentry-native (macos)
        if: ${{ (env.CI_PUBLISHING_BUILD == 'true') || (matrix.rid == 'macos') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Sentry/Platforms/Native/sentry-native
          key: sentry-native-macos-${{ hashFiles('scripts/build-sentry-native.ps1') }}-${{ hashFiles('.git/modules/modules/sentry-native/HEAD') }}
          fail-on-cache-miss: true

      - name: Download sentry-native (win-x64)
        if: ${{ (env.CI_PUBLISHING_BUILD == 'true') || (matrix.rid == 'win-x64') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Sentry/Platforms/Native/sentry-native
          key: sentry-native-win-x64-${{ hashFiles('scripts/build-sentry-native.ps1') }}-${{ hashFiles('.git/modules/modules/sentry-native/HEAD') }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true

      - name: Download sentry-native (win-arm64)
        if: ${{ (env.CI_PUBLISHING_BUILD == 'true') || (matrix.rid == 'win-arm64') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Sentry/Platforms/Native/sentry-native
          key: sentry-native-win-arm64-${{ hashFiles('scripts/build-sentry-native.ps1') }}-${{ hashFiles('.git/modules/modules/sentry-native/HEAD') }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true

      # The Cocoa SDK is built from the submodule by the Sentry.Bindings.Cocoa project, which takes ~15 minutes
      # on a hosted runner. build-sentry-cocoa.sh skips the build when the restored stamp matches.
      # Release builds always build it from source, because it ships in the Sentry.Bindings.Cocoa package.
      - name: Get Cocoa SDK cache key
        id: cocoa-key
        if: runner.os == 'macOS'
        uses: ./.github/actions/cocoa-cache-key

      - name: Restore Cocoa SDK
        id: cache-cocoa
        if: runner.os == 'macOS' && !startsWith(github.ref_name, 'release/')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/sentry-cocoa/Carthage
          key: ${{ steps.cocoa-key.outputs.key }}

      - name: Build Native Dependencies
        if: ${{ !matrix.container && !env.NO_MOBILE }}
        uses: ./.github/actions/buildnative

      - name: Restore .NET Dependencies
        run: dotnet restore ${{ matrix.slnf }} --nologo

      - name: Build
        id: build
        run: dotnet build ${{ matrix.slnf }} -c Release --no-restore --nologo -v:minimal -p:CopyLocalLockFileAssemblies=true -bl:build.binlog

      # Only a completed Cocoa build writes the stamp, so a failed one is never cached.
      - name: Save Cocoa SDK
        if: ${{ !cancelled() && steps.cache-cocoa.outputs.cache-primary-key != '' && steps.cache-cocoa.outputs.cache-hit != 'true' && hashFiles('modules/sentry-cocoa/Carthage/.built-from-sha') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/sentry-cocoa/Carthage
          key: ${{ steps.cache-cocoa.outputs.cache-primary-key }}

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.rid }}-build-logs
          path: build.binlog
          if-no-files-found: ignore

      - name: Free disk space before tests
        if: ${{ contains(matrix.container.image, 'alpine') }}
        run: |
          echo "Disk usage before cleanup:"
          df -h

          # Remove build binlog (can be large, often 100MB+)
          rm -f build.binlog || true

          # Clean up NuGet HTTP cache (not the packages cache which is needed for pack)
          dotnet nuget locals http-cache --clear || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Test
        run: dotnet test ${{ matrix.slnf }} -c Release --no-build --nologo -l GitHubActions -l "trx;LogFilePrefix=testresults_${{ runner.os }}" --collect "XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByAttribute=GeneratedCodeAttribute

      - name: Upload code coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload build and test outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.rid }}-verify-test-results
          path: "**/*.received.*"

      - name: Create NuGet Packages
        run: dotnet pack ${{ matrix.slnf }} -c Release --no-build --nologo

      - name: Archive NuGet Packages
        if: env.CI_PUBLISHING_BUILD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.sha }}
          if-no-files-found: error
          path: |
            src/**/Release/*.nupkg
            src/**/Release/*.snupkg

      - name: Sparse checkout
        if: env.CI_PUBLISHING_BUILD == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We only check out what is absolutely necessary to reduce a chance of local files impacting
          # integration tests (nuget.config etc.)... But we need the root Directory.Build.props calculate
          # the package version
          sparse-checkout: |
            integration-test
            scripts
            .github

      - name: Fetch NuGet Packages
        if: env.CI_PUBLISHING_BUILD == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.sha }}
          path: src

      # ContainerBaseImage comes from the workflow-level env block at the top of this file.
      - name: Integration test
        if: matrix.rid == 'linux-arm64' || matrix.rid == 'macos'
        uses: getsentry/github-workflows/sentry-cli/integration-test@959162c159b866489d3fabe93327f48f9b8cb7ee # 3.4.1
        # The MAUI cases run in the integration-test job, against packages built there. On release branches they run
        # here too, so the packages craft publishes are the ones tested.
        env:
          SKIP_MAUI_TESTS: ${{ runner.os == 'macOS' && !startsWith(github.ref_name, 'release/') }}
          ContainerBaseImage: ${{ env.CONTAINER_BASE_IMAGE_GLIBC }}
        with:
          path: integration-test

      - name: Integration test (musl)
        if: matrix.rid == 'linux-musl-x64' || matrix.rid == 'linux-musl-arm64'
        uses: getsentry/github-workflows/sentry-cli/integration-test@959162c159b866489d3fabe93327f48f9b8cb7ee # 3.4.1
        env:
          ContainerBaseImage: ${{ env.CONTAINER_BASE_IMAGE_MUSL }}
        with:
          path: integration-test

      # Sentry turns SentryNative off on runtimes that have no native SDK. aot.Tests.ps1 checks that against this
      # leg's own packages: linux-arm on the linux-arm64 runner, and win-x86 on the win-x64 runner.
      - name: Install Linux ARM 32-bit dependencies
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6:armhf

      # Some arm64 hosts can't run 32-bit ARM binaries ("Exec format error"), so QEMU runs them on every host. Its
      # binfmt_misc handler takes precedence over the kernel's own loader, so it does even where the host could.
      - name: Set up QEMU for 32-bit ARM
        if: matrix.rid == 'linux-arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # The action runs this image privileged, so it's pinned like the action
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm

      - name: Check that QEMU handles 32-bit ARM binaries
        if: matrix.rid == 'linux-arm64'
        run: grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-arm

      - name: Test AOT on an unsupported runtime
        if: matrix.rid == 'linux-arm64' || matrix.rid == 'win-x64'
        uses: getsentry/github-workflows/sentry-cli/integration-test@959162c159b866489d3fabe93327f48f9b8cb7ee # 3.4.1
        env:
          RuntimeIdentifier: ${{ matrix.rid == 'linux-arm64' && 'linux-arm' || 'win-x86' }}
          # The glibc tag covers linux/arm/v7; win-x86 skips the Container test.
          ContainerBaseImage: ${{ env.CONTAINER_BASE_IMAGE_GLIBC }}
        with:
          path: integration-test/aot.Tests.ps1

  # These run integration tests next to a build leg, against packages built here from only the projects the tests
  # use, which the Sentry-CI-IntegrationTest filters list. CI_PUBLISHING_BUILD only adds the other platforms' native
  # libraries and sentry-cli binaries, which these tests don't use.
  # - macos: the MAUI cases build three Release apps, which takes 8-10 minutes. On release branches the macOS leg
  #   runs them too, against the packages it publishes.
  # - linux-x64, win-x64 and win-arm64: every integration test runs here, in parallel with the leg.
  integration-test:
    needs: build-sentry-native
    name: Integration test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            rid: macos
            slnf: Sentry-CI-IntegrationTest-macOS.slnf
            tests: integration-test/cli-maui.Tests.ps1
          - os: ubuntu-24.04
            rid: linux-x64
            slnf: Sentry-CI-IntegrationTest.slnf
            tests: integration-test
          - os: windows-2025-vs2026
            rid: win-x64
            slnf: Sentry-CI-IntegrationTest.slnf
            tests: integration-test
          - os: windows-11-vs2026-arm
            rid: win-arm64
            slnf: Sentry-CI-IntegrationTest.slnf
            tests: integration-test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Remove unused applications
        uses: ./.github/actions/freediskspace

      - name: Setup Environment
        uses: ./.github/actions/environment
        with:
          projects: ${{ matrix.slnf }}

      - name: Download sentry-native (${{ matrix.rid }})
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Sentry/Platforms/Native/sentry-native
          key: sentry-native-${{ matrix.rid }}-${{ hashFiles('scripts/build-sentry-native.ps1') }}-${{ hashFiles('.git/modules/modules/sentry-native/HEAD') }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true

      - name: Get Cocoa SDK cache key
        id: cocoa-key
        if: runner.os == 'macOS'
        uses: ./.github/actions/cocoa-cache-key

      - name: Restore Cocoa SDK
        id: cache-cocoa
        if: runner.os == 'macOS' && !startsWith(github.ref_name, 'release/')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/sentry-cocoa/Carthage
          key: ${{ steps.cocoa-key.outputs.key }}

      - name: Build Native Dependencies
        uses: ./.github/actions/buildnative

      - name: Build
        run: dotnet build ${{ matrix.slnf }} -c Release --nologo -v:minimal

      - name: Save Cocoa SDK
        if: ${{ !cancelled() && steps.cache-cocoa.outputs.cache-primary-key != '' && steps.cache-cocoa.outputs.cache-hit != 'true' && hashFiles('modules/sentry-cocoa/Carthage/.built-from-sha') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/sentry-cocoa/Carthage
          key: ${{ steps.cache-cocoa.outputs.cache-primary-key }}

      # Like the build legs, pack the build outputs. Packing Sentry.Maui while building it on macOS fails with NU5026,
      # looking for the Windows target's .pri file, which isn't generated on macOS.
      - name: Create NuGet Packages
        run: dotnet pack ${{ matrix.slnf }} -c Release --no-build --nologo

      - name: Integration test
        uses: getsentry/github-workflows/sentry-cli/integration-test@959162c159b866489d3fabe93327f48f9b8cb7ee # 3.4.1
        env:
          ContainerBaseImage: ${{ env.CONTAINER_BASE_IMAGE_GLIBC }}
        with:
          path: ${{ matrix.tests }}

  ms-build:
    needs: build-sentry-native
    name: MSBuild
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Download sentry-native (win-x64)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Sentry/Platforms/Native/sentry-native
          key: sentry-native-win-x64-${{ hashFiles('scripts/build-sentry-native.ps1') }}-${{ hashFiles('.git/modules/modules/sentry-native/HEAD') }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true

      - name: Setup Environment
        uses: ./.github/actions/environment
        with:
          projects: Sentry-CI-Build-Windows.slnf samples/Sentry.Samples.Maui/Sentry.Samples.Maui.csproj

      - name: Build Native Dependencies
        uses: ./.github/actions/buildnative

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Run MSBuild
        id: msbuild
        run: msbuild Sentry-CI-Build-Windows.slnf -restore -t:Build,Pack -p:Configuration=Release -m -nr:false --nologo -v:minimal -p:CopyLocalLockFileAssemblies=true -bl:msbuild.binlog

      # The app samples build in their own job, with the .NET CLI, so the MAUI sample's Android and Windows targets
      # get an MSBuild build here
      - name: Build the MAUI sample
        run: msbuild samples/Sentry.Samples.Maui/Sentry.Samples.Maui.csproj -restore -t:Build -p:Configuration=Release -m -nr:false --nologo -v:minimal -p:CopyLocalLockFileAssemblies=true -bl:msbuild-maui.binlog

      - name: Test MSBuild
        uses: getsentry/github-workflows/sentry-cli/integration-test@959162c159b866489d3fabe93327f48f9b8cb7ee # 3.4.1
        with:
          path: integration-test/msbuild.Tests.ps1

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ runner.os }}-msbuild-logs
          path: |
            msbuild.binlog
            msbuild-maui.binlog
          if-no-files-found: ignore

  trim-analysis:
    needs: build-sentry-native
    name: Trim analysis
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 2 # default is 1 and codecov needs > 1

      # We use macOS for the final publishing build so we get all the iOS/Mac Catalyst targets in the packages
      - name: Set Environment Variables
        run: echo "CI_PUBLISHING_BUILD=true" >> $GITHUB_ENV

      - name: Download sentry-native (macos)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Sentry/Platforms/Native/sentry-native
          key: sentry-native-macos-${{ hashFiles('scripts/build-sentry-native.ps1') }}-${{ hashFiles('.git/modules/modules/sentry-native/HEAD') }}
          fail-on-cache-miss: true

      - name: Setup Environment
        uses: ./.github/actions/environment
        with:
          projects: test/Sentry.TrimTest/Sentry.TrimTest.csproj test/Sentry.MauiTrimTest/Sentry.MauiTrimTest.csproj

      - name: Build Native Dependencies
        uses: ./.github/actions/buildnative

      - name: Publish Test app (macOS)
        run: dotnet publish test/Sentry.TrimTest/Sentry.TrimTest.csproj -c Release -r osx-arm64 -p:NO_MOBILE=true

      - name: Publish Test app (Android)
        run: dotnet publish test/Sentry.MauiTrimTest/Sentry.MauiTrimTest.csproj -c Release -f net10.0-android36.0 -r android-arm64

# We can't publish iOS applications on CI yet. We'd need a valid bundle identifier and to install the relevant
# certificates/profiles on CI (presumably certs associated with the Sentry org).
# See https://youtrack.jetbrains.com/issue/RIDER-17115/Could-not-find-any-available-provisioning-profiles-for-iOS
#      - name: Publish Test app (iOS)
#        run: dotnet publish test/Sentry.MauiTrimTest/Sentry.MauiTrimTest.csproj -c Release -f net10.0-ios26 -r ios-arm64

  # Nothing consumes the app samples, but their Release builds trim and AOT-compile each app, which made them the
  # last minutes of the Build step in the .NET legs. Here they build next to the legs instead of inside them.
  build-samples:
    needs: build-sentry-native
    name: Samples (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            rid: macos
            samples: Sentry-CI-Build-Samples-macOS.slnf
          # The MAUI sample's Windows target, which the MSBuild job also builds with msbuild.exe
          - os: windows-2025-vs2026
            rid: win-x64
            samples: samples/Sentry.Samples.Maui/Sentry.Samples.Maui.csproj
          # The Android and MAUI samples' Android targets on a Linux host, as the linux-x64 leg built them
          - os: ubuntu-24.04
            rid: linux-x64
            samples: Sentry-CI-Build-Samples-Linux.slnf

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Environment
        uses: ./.github/actions/environment
        with:
          projects: ${{ matrix.samples }}

      - name: Download sentry-native (${{ matrix.rid }})
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Sentry/Platforms/Native/sentry-native
          key: sentry-native-${{ matrix.rid }}-${{ hashFiles('scripts/build-sentry-native.ps1') }}-${{ hashFiles('.git/modules/modules/sentry-native/HEAD') }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true

      # See build-sentry
      - name: Get Cocoa SDK cache key
        id: cocoa-key
        if: runner.os == 'macOS'
        uses: ./.github/actions/cocoa-cache-key

      - name: Restore Cocoa SDK
        id: cache-cocoa
        if: runner.os == 'macOS' && !startsWith(github.ref_name, 'release/')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/sentry-cocoa/Carthage
          key: ${{ steps.cocoa-key.outputs.key }}

      - name: Build Native Dependencies
        uses: ./.github/actions/buildnative

      - name: Restore .NET Dependencies
        run: dotnet restore ${{ matrix.samples }} --nologo

      - name: Build
        run: dotnet build ${{ matrix.samples }} -c Release --no-restore --nologo -v:minimal -bl:build.binlog

      - name: Save Cocoa SDK
        if: ${{ !cancelled() && steps.cache-cocoa.outputs.cache-primary-key != '' && steps.cache-cocoa.outputs.cache-hit != 'true' && hashFiles('modules/sentry-cocoa/Carthage/.built-from-sha') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/sentry-cocoa/Carthage
          key: ${{ steps.cache-cocoa.outputs.cache-primary-key }}

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: samples-${{ matrix.rid }}-build-logs
          path: build.binlog
          if-no-files-found: ignore

  test-solution-filters:
    runs-on: ubuntu-24.04
    if: ${{ !startsWith(github.ref_name, 'release/') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Rebuild Solution Filters
        shell: pwsh
        run: pwsh scripts/generate-solution-filters.ps1

      - name: Ensure Solution Filters are up to date
        shell: pwsh
        run: scripts/dirty-check.ps1 -PathToCheck ./*.sln* -GuidanceOnFailure "Uncommitted changes to the solution filters detected. Run `scripts/generate-solution-filters.ps1` locally and commit changes."
