name: Setup Environment
description: Sets env vars and installs dependencies
inputs:
  projects:
    description: The solution filters and project files the job builds, separated by spaces, so only the workloads they need are installed. Jobs that build everything pass Sentry.slnx.
    required: true
runs:
  using: composite

  steps:

    # The Windows images keep .NET under Program Files, where workloads install as MSI packages, and the NuGet cache
    # in the user profile on C:. So .NET goes next to the workspace, where workloads install as plain files. The x64
    # runners put the workspace on D:, so the NuGet packages go there too. The arm64 runners only have C:, so the
    # NuGet packages and TEMP go on a Dev Drive there. Defender already excludes C:\ on these images.
    - name: Install .NET and NuGet packages on a fast drive
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $root = Split-Path $env:GITHUB_WORKSPACE
        "DOTNET_INSTALL_DIR=$root\.dotnet" >> $env:GITHUB_ENV
        if ($root.StartsWith('C:'))
        {
            try
            {
                # Only volumes mounted after this get no antivirus filters
                fsutil devdrv enable /disallowAv | Out-Host
                'create vdisk file="C:\devdrive.vhdx" maximum=81920 type=expandable', 'select vdisk file="C:\devdrive.vhdx"', 'attach vdisk', 'convert gpt', 'create partition primary' |
                    Set-Content "$env:RUNNER_TEMP\diskpart.txt"
                diskpart /s "$env:RUNNER_TEMP\diskpart.txt" | Out-Host
                if ($LASTEXITCODE -ne 0) { throw "diskpart failed with exit code $LASTEXITCODE" }
                $partition = Get-DiskImage -ImagePath 'C:\devdrive.vhdx' | Get-Disk | Get-Partition | Where-Object Type -eq 'Basic'
                $partition | Format-Volume -DevDrive -Confirm:$false -Force | Out-Host
                $partition | Add-PartitionAccessPath -AccessPath 'X:\'
                # Right after the mount, trust can fail with "Access is denied" while the volume is still in use
                for ($attempt = 1; $attempt -le 5; $attempt++)
                {
                    fsutil devdrv trust X: | Out-Host
                    if ($LASTEXITCODE -eq 0) { break }
                    Start-Sleep -Seconds 3
                }
                if ($LASTEXITCODE -ne 0) { Write-Warning "Couldn't mark X: as a trusted Dev Drive, so antivirus filters may still scan it" }
                fsutil devdrv query X: | Out-Host
                New-Item -ItemType Directory 'X:\tmp' | Out-Null
                'TEMP=X:\tmp' >> $env:GITHUB_ENV
                'TMP=X:\tmp' >> $env:GITHUB_ENV
                $root = 'X:'
            }
            catch
            {
                # The Dev Drive is a speedup, so the job goes on without it
                Write-Warning "Couldn't set up the Dev Drive, so the NuGet packages stay next to the workspace: $_"
            }
        }
        "NUGET_PACKAGES=$root\.nuget\packages" >> $env:GITHUB_ENV
        $global:LASTEXITCODE = 0

    - name: Set Global Environment Variables
      shell: bash
      run: |
        echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> $GITHUB_ENV
        echo "DOTNET_NOLOGO=1" >> $GITHUB_ENV

    # Android SDK Tools are arm64-incompatible
    # Android SDK Build Tools are musl-incompatible
    - name: Set Environment Variables for Alpine Linux
      if: ${{ (runner.os == 'Linux' && runner.arch == 'ARM64') || contains(matrix.container.image, 'alpine') }}
      shell: bash
      run: echo "NO_MOBILE=true" >> $GITHUB_ENV

    # Allow sudoless Docker in integration tests
    - name: Prepare Docker on Alpine Linux
      if: ${{ contains(matrix.container.image, 'alpine') }}
      shell: bash
      run: sudo chmod 666 /var/run/docker.sock

    # Install old deprecated libssl1 for .NET 5.0 on Linux
    - name: Install libssl1 for NET 5.0 on Linux
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: sudo ./scripts/install-libssl1.sh

    - name: Pin the Xcode Version
      if: runner.os == 'macOS'
      uses: ./.github/actions/pin-xcode

    # Java 21 is needed by .NET Android
    - name: Install Java 21
      if: ${{ !matrix.container && env.NO_MOBILE != 'true' }}
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '21'

    - name: Setup Android SDK
      if: ${{ !matrix.container && env.NO_MOBILE != 'true' }}
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        # Exclude "tools" because the emulator is not needed (nor available for Windows/Linux ARM64)
        packages: platform-tools platforms;android-35 platforms;android-36 platforms;android-37.0 build-tools;36.0.0
        log-accepted-android-sdk-licenses: false

    - name: Install .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        dotnet-version: |
          8.0.x
          9.0.310
          10.0.x

    # .NET 5.0 does not support ARM64 on macOS
    - name: Install .NET 5.0 SDK
      if: ${{ runner.os != 'macOS' || runner.arch != 'ARM64' }}
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 5.0.x

    - name: Install .NET Workloads
      shell: bash
      env:
        PROJECTS: ${{ inputs.projects }}
      run: |
        set -euo pipefail
        pwd
        projects=()
        for item in $PROJECTS; do
          if [[ "$item" == *.slnf ]]; then
            # dotnet workload restore doesn't accept a solution filter, but it accepts the projects in one
            found=$(grep -o '"[^"]*\.csproj"' "$item" | tr -d '"' | sed 's#\\\\#/#g' || true)
            if [[ -z "$found" ]]; then
              echo "::error::Found no projects in $item, so there are no workloads to restore"
              exit 1
            fi
            projects+=($found)
          else
            projects+=("$item")
          fi
        done
        if [[ ${#projects[@]} -eq 0 ]]; then
          echo "::error::Pass the solution filters or project files this job builds as projects, so only their workloads are installed"
          exit 1
        fi
        dotnet workload restore "${projects[@]}" --temp-dir "${{ runner.temp }}" --skip-sign-check
        # Sentry.Android.AssemblyReader.Tests builds the Android test app with an MSBuild task, not a project reference,
        # so workload restore doesn't see it. grep reads a here-string because with pipefail, printf piped into grep -q
        # fails with SIGPIPE when grep exits before printf has written everything.
        if grep -q -E 'Sentry\.slnx$|Sentry\.Android\.AssemblyReader\.Tests|AndroidTestApp' <<< "$(printf '%s\n' "${projects[@]}")"; then
          dotnet workload restore test/AndroidTestApp/AndroidTestApp.csproj \
            --temp-dir "${{ runner.temp }}" \
            --skip-sign-check
          # Restore the Android test app explicitly to ensure runtime packs are available
          dotnet restore test/AndroidTestApp/AndroidTestApp.csproj -r android-x64 --nologo || true
        fi
