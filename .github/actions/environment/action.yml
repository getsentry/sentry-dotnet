name: Setup Environment
description: Sets env vars and installs dependencies
inputs:
  projects:
    description: The solution filters and project files the job builds, separated by spaces, so only the workloads they need are installed. Jobs that build everything pass Sentry.slnx.
    required: true
  save-toolchain:
    description: Whether to save the Windows toolchain cache on a miss. The build legs install the most workloads, so they save it.
    required: false
    default: 'false'
runs:
  using: composite

  steps:

    - name: Set Global Environment Variables
      shell: bash
      run: |
        echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> $GITHUB_ENV
        echo "DOTNET_NOLOGO=1" >> $GITHUB_ENV

    # Android SDK Tools are arm64-incompatible
    # Android SDK Build Tools are musl-incompatible
    - name: Set Environment Variables for Alpine Linux
      if: ${{ (runner.os == 'Linux' && runner.arch == 'ARM64') || contains(matrix.container.image, 'alpine') }}
      shell: bash
      run: echo "NO_MOBILE=true" >> $GITHUB_ENV

    # Allow sudoless Docker in integration tests
    - name: Prepare Docker on Alpine Linux
      if: ${{ contains(matrix.container.image, 'alpine') }}
      shell: bash
      run: sudo chmod 666 /var/run/docker.sock

    # Install old deprecated libssl1 for .NET 5.0 on Linux
    - name: Install libssl1 for NET 5.0 on Linux
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: sudo ./scripts/install-libssl1.sh

    # See https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md#xcode
    # Also https://github.com/dotnet/macios/issues/21762#issuecomment-3424033859 (don't reference symlinks)
    - name: Pin the Xcode Version
      if: runner.os == 'macOS'
      shell: bash
      run: sudo xcode-select --switch /Applications/Xcode_27.app

    # Java 21 is needed by .NET Android
    - name: Install Java 21
      if: ${{ !matrix.container && env.NO_MOBILE != 'true' }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '21'

    # The Windows jobs keep .NET next to the workspace, see windows-dotnet-drive, so all of them on one architecture
    # share one copy of the SDKs and workloads. The arm64 image has no Android SDK, so its jobs share one copy of that.
    # The workload restore below still runs, and adds whatever this job needs that the cached copy lacks.
    - name: Restore the .NET toolchain
      id: dotnet-toolchain
      if: runner.os == 'Windows' && env.DOTNET_INSTALL_DIR != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.DOTNET_INSTALL_DIR }}
        key: dotnet-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '.github/actions/environment/action.yml') }}

    - name: Use the cached .NET toolchain
      if: steps.dotnet-toolchain.outputs.cache-hit == 'true'
      shell: pwsh
      run: |
        "DOTNET_ROOT=$env:DOTNET_INSTALL_DIR" >> $env:GITHUB_ENV
        $env:DOTNET_INSTALL_DIR >> $env:GITHUB_PATH

    - name: Restore the Android SDK
      id: android-sdk
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.android/sdk
        key: android-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/environment/action.yml') }}

    - name: Use the cached Android SDK
      if: steps.android-sdk.outputs.cache-hit == 'true'
      shell: pwsh
      run: |
        $sdk = Join-Path $HOME '.android\sdk'
        "ANDROID_HOME=$sdk" >> $env:GITHUB_ENV
        "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
        Join-Path $sdk 'platform-tools' >> $env:GITHUB_PATH

    - name: Setup Android SDK
      if: ${{ !matrix.container && env.NO_MOBILE != 'true' && steps.android-sdk.outputs.cache-hit != 'true' }}
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        # Exclude "tools" because the emulator is not needed (nor available for Windows/Linux ARM64)
        packages: platform-tools platforms;android-35 platforms;android-36 build-tools;36.0.0
        log-accepted-android-sdk-licenses: false

    - name: Install .NET SDK
      if: steps.dotnet-toolchain.outputs.cache-hit != 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        dotnet-version: |
          8.0.x
          9.0.310

    # .NET 5.0 does not support ARM64 on macOS
    - name: Install .NET 5.0 SDK
      if: ${{ (runner.os != 'macOS' || runner.arch != 'ARM64') && steps.dotnet-toolchain.outputs.cache-hit != 'true' }}
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 5.0.x

    - name: Install .NET Workloads
      shell: bash
      run: |
        set -euo pipefail
        pwd
        projects=()
        for item in ${{ inputs.projects }}; do
          if [[ "$item" == *.slnf ]]; then
            # dotnet workload restore doesn't accept a solution filter, but it accepts the projects in one
            found=$(grep -o '"[^"]*\.csproj"' "$item" | tr -d '"' | sed 's#\\\\#/#g' || true)
            if [[ -z "$found" ]]; then
              echo "::error::Found no projects in $item, so there are no workloads to restore"
              exit 1
            fi
            projects+=($found)
          else
            projects+=("$item")
          fi
        done
        if [[ ${#projects[@]} -eq 0 ]]; then
          echo "::error::Pass the solution filters or project files this job builds as projects, so only their workloads are installed"
          exit 1
        fi
        dotnet workload restore "${projects[@]}" --temp-dir "${{ runner.temp }}" --skip-sign-check
        # Sentry.Android.AssemblyReader.Tests builds the Android test app with an MSBuild task, not a project reference,
        # so workload restore doesn't see it. The Windows solution filters exclude both.
        if [[ "$RUNNER_OS" != "Windows" ]] && printf '%s\n' "${projects[@]}" | grep -q -E 'Sentry\.slnx$|Sentry\.Android\.AssemblyReader\.Tests|AndroidTestApp'; then
          dotnet workload restore test/AndroidTestApp/AndroidTestApp.csproj \
            --temp-dir "${{ runner.temp }}" \
            --skip-sign-check
          # Restore the Android test app explicitly to ensure runtime packs are available
          dotnet restore test/AndroidTestApp/AndroidTestApp.csproj -r android-x64 --nologo || true
        fi

    - name: Save the .NET toolchain
      if: inputs.save-toolchain == 'true' && steps.dotnet-toolchain.outcome == 'success' && steps.dotnet-toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.DOTNET_INSTALL_DIR }}
        key: ${{ steps.dotnet-toolchain.outputs.cache-primary-key }}

    - name: Save the Android SDK
      if: inputs.save-toolchain == 'true' && steps.android-sdk.outcome == 'success' && steps.android-sdk.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.android/sdk
        key: ${{ steps.android-sdk.outputs.cache-primary-key }}
