name: Setup Environment
description: Sets env vars and installs dependencies
inputs:
  projects:
    description: The solution filters and project files the job builds, separated by spaces, so only the workloads they need are installed. Jobs that build everything pass Sentry.slnx.
    required: true
runs:
  using: composite

  steps:

    - name: Set Global Environment Variables
      shell: bash
      run: |
        echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> $GITHUB_ENV
        echo "DOTNET_NOLOGO=1" >> $GITHUB_ENV

    # Android SDK Tools are arm64-incompatible
    # Android SDK Build Tools are musl-incompatible
    - name: Set Environment Variables for Alpine Linux
      if: ${{ (runner.os == 'Linux' && runner.arch == 'ARM64') || contains(matrix.container.image, 'alpine') }}
      shell: bash
      run: echo "NO_MOBILE=true" >> $GITHUB_ENV

    # Allow sudoless Docker in integration tests
    - name: Prepare Docker on Alpine Linux
      if: ${{ contains(matrix.container.image, 'alpine') }}
      shell: bash
      run: sudo chmod 666 /var/run/docker.sock

    # Install old deprecated libssl1 for .NET 5.0 on Linux
    - name: Install libssl1 for NET 5.0 on Linux
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: sudo ./scripts/install-libssl1.sh

    # See https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md#xcode
    # Also https://github.com/dotnet/macios/issues/21762#issuecomment-3424033859 (don't reference symlinks)
    - name: Pin the Xcode Version
      if: runner.os == 'macOS'
      shell: bash
      run: sudo xcode-select --switch /Applications/Xcode_27.app

    # Java 21 is needed by .NET Android
    - name: Install Java 21
      if: ${{ !matrix.container && env.NO_MOBILE != 'true' }}
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '21'

    - name: Setup Android SDK
      if: ${{ !matrix.container && env.NO_MOBILE != 'true' }}
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        # Exclude "tools" because the emulator is not needed (nor available for Windows/Linux ARM64)
        packages: platform-tools platforms;android-35 platforms;android-36 build-tools;36.0.0
        log-accepted-android-sdk-licenses: false

    - name: Install .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        dotnet-version: |
          8.0.x
          9.0.310

    # .NET 5.0 does not support ARM64 on macOS
    - name: Install .NET 5.0 SDK
      if: ${{ runner.os != 'macOS' || runner.arch != 'ARM64' }}
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 5.0.x

    - name: Install .NET Workloads
      shell: bash
      env:
        PROJECTS: ${{ inputs.projects }}
      run: |
        set -euo pipefail
        pwd
        projects=()
        for item in $PROJECTS; do
          if [[ "$item" == *.slnf ]]; then
            # dotnet workload restore doesn't accept a solution filter, but it accepts the projects in one
            found=$(grep -o '"[^"]*\.csproj"' "$item" | tr -d '"' | sed 's#\\\\#/#g' || true)
            if [[ -z "$found" ]]; then
              echo "::error::Found no projects in $item, so there are no workloads to restore"
              exit 1
            fi
            projects+=($found)
          else
            projects+=("$item")
          fi
        done
        if [[ ${#projects[@]} -eq 0 ]]; then
          echo "::error::Pass the solution filters or project files this job builds as projects, so only their workloads are installed"
          exit 1
        fi
        dotnet workload restore "${projects[@]}" --temp-dir "${{ runner.temp }}" --skip-sign-check
        # Sentry.Android.AssemblyReader.Tests builds the Android test app with an MSBuild task, not a project reference,
        # so workload restore doesn't see it. grep reads a here-string because with pipefail, printf piped into grep -q
        # fails with SIGPIPE when grep exits before printf has written everything.
        if grep -q -E 'Sentry\.slnx$|Sentry\.Android\.AssemblyReader\.Tests|AndroidTestApp' <<< "$(printf '%s\n' "${projects[@]}")"; then
          dotnet workload restore test/AndroidTestApp/AndroidTestApp.csproj \
            --temp-dir "${{ runner.temp }}" \
            --skip-sign-check
          # Restore the Android test app explicitly to ensure runtime packs are available
          dotnet restore test/AndroidTestApp/AndroidTestApp.csproj -r android-x64 --nologo || true
        fi
