name: Windows .NET drive
description: Installs .NET and the NuGet packages on a fast drive on Windows runners
runs:
  using: composite

  steps:
    # The Windows images keep .NET under Program Files, where workloads install as MSI packages, and the NuGet cache
    # in the user profile on C:. The x64 runners put the workspace on D:, so both go next to it. The arm64 runners
    # only have C:, so both go on a Dev Drive there, with TEMP. Defender already excludes C:\ on these images.
    - name: Install .NET and NuGet packages on a fast drive
      shell: pwsh
      run: |
        $root = Split-Path $env:GITHUB_WORKSPACE
        if ($root.StartsWith('C:'))
        {
            'create vdisk file="C:\devdrive.vhdx" maximum=81920 type=expandable', 'select vdisk file="C:\devdrive.vhdx"', 'attach vdisk', 'convert gpt', 'create partition primary' |
                Set-Content "$env:RUNNER_TEMP\diskpart.txt"
            diskpart /s "$env:RUNNER_TEMP\diskpart.txt" | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "diskpart failed with exit code $LASTEXITCODE" }
            $partition = Get-DiskImage -ImagePath 'C:\devdrive.vhdx' | Get-Disk | Get-Partition | Where-Object Type -eq 'Basic'
            $partition | Format-Volume -DevDrive -Confirm:$false -Force | Out-Host
            $partition | Add-PartitionAccessPath -AccessPath 'X:\'
            fsutil devdrv enable /disallowAv
            fsutil devdrv trust X:
            $root = 'X:'
            New-Item -ItemType Directory "$root\tmp" | Out-Null
            "TEMP=$root\tmp" >> $env:GITHUB_ENV
            "TMP=$root\tmp" >> $env:GITHUB_ENV
        }
        "DOTNET_INSTALL_DIR=$root\.dotnet" >> $env:GITHUB_ENV
        "NUGET_PACKAGES=$root\.nuget\packages" >> $env:GITHUB_ENV
