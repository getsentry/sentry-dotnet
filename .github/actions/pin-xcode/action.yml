name: Pin Xcode
description: Selects the Xcode that the macOS jobs build with
runs:
  using: composite

  steps:
    # See https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md#xcode
    # Also https://github.com/dotnet/macios/issues/21762#issuecomment-3424033859 (don't reference symlinks)
    - name: Pin the Xcode Version
      shell: bash
      run: sudo xcode-select --switch /Applications/Xcode_27.app
