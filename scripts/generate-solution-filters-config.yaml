################################################################
# This file is used by generate-solution-filters.ps1 to generate
# the *.slnf solution filters for the Sentry solution.
################################################################

coreSolution: Sentry.slnx
# We don't maintain the buildSolutions manually... these are just
# copies of Sentry.slnx that are used to set certain build
# properties when using solution filters that are based on these
buildSolutions:
  - .generated.NoMobile.slnx

groupConfigs:
  allProjects:
      - "benchmarks/**/*.csproj"
      - "src/**/*.csproj"
      - "test/**/*.csproj"
      - "samples/**/*.csproj"
  macOnly:
    - "**/*MacOS.csproj"
    - "**/*Ios.csproj"
    - "**/*Cocoa*.csproj"
    - "**/*MacCatalyst.csproj"
  windowsOnly:
    # .NET Framework projects
    - "**/*.AspNet.csproj"
    - "**/*.AspNet.Tests.csproj"
  artefacts:
    # Any projects in the obj or bin directories
    - "**/obj/**/*.csproj"
    - "**/bin/**/*.csproj"
  trimTests:
    - "**/Sentry.TrimTest.csproj"
    - "**/Sentry.MauiTrimTest.csproj"
  playwrightTests:
    - "**/*PlaywrightTests*.csproj"
  mobileOnly:
    - "**/*Android*.csproj"
    - "**/*Ios*.csproj"
    - "**/*MacCatalyst*.csproj"
    - "**/*Maui*.csproj"
  # The build workflow builds these in its own job, off the critical path
  appSamples:
    - "**/Sentry.Samples.Android.csproj"
    - "**/Sentry.Samples.Ios.csproj"
    - "**/Sentry.Samples.MacCatalyst.csproj"
    - "**/Sentry.Samples.MacOS.csproj"
    - "**/Sentry.Samples.Maui.csproj"
  # The packages the integration tests use, which the build workflow's integration-test job builds and packs
  integrationTestPackages:
    - "**/Sentry.csproj"
    - "**/Sentry.Extensions.Logging.csproj"
    - "**/Sentry.Maui.csproj"
    - "**/Sentry.Bindings.Android.csproj"
    - "**/Sentry.Android.AssemblyReader.csproj"
    - "**/Sentry.Bindings.Cocoa.csproj"

filterConfigs:

  - outputPath: Sentry-CI-Build-Linux.slnf
    include:
      groups:
        - "allProjects"
    exclude:
      groups:
        - "appSamples"
        - "macOnly"
        - "windowsOnly"
        - "artefacts"
        - "trimTests"
        - "playwrightTests"
      patterns:
        - "**/*AndroidTestApp.csproj"
        - "**/*DeviceTests*.csproj"
        - "**/*Maui.Device.TestApp.csproj"

  - outputPath: Sentry-CI-Build-Linux-NoMobile.slnf
    solution: .generated.NoMobile.slnx
    include:
      groups:
        - "allProjects"
    exclude:
      groups:
        - "macOnly"
        - "windowsOnly"
        - "artefacts"
        - "trimTests"
        - "mobileOnly"
        - "playwrightTests"
      patterns:
        - "**/*Android*.csproj"
        - "**/*DeviceTests*.csproj"
        - "**/*Maui*.csproj"

  - outputPath: Sentry-CI-Build-macOS.slnf
    include:
      groups:
        - "allProjects"
      patterns:
        - "modules/perfview/**/TraceEvent.csproj"
        - "modules/perfview/**/FastSerialization.csproj"
    exclude:
      groups:
        - "appSamples"
        - "artefacts"
        - "trimTests"
        - "playwrightTests"
      patterns:
        - "**/*AndroidTestApp.csproj"
        - "**/*DeviceTests*.csproj"
        - "**/*Sentry.Maui.Device.TestApp.csproj"
        - "**/*.AspNet.Tests.csproj"

  - outputPath: Sentry-CI-Build-Windows.slnf
    include:
      groups:
        - "allProjects"
      patterns:
        - "modules/perfview/**/TraceEvent.csproj"
        - "modules/perfview/**/FastSerialization.csproj"
    exclude:
      groups:
        - "appSamples"
        - "macOnly"
        - "artefacts"
        - "trimTests"
        - "playwrightTests"
      patterns:
        - "**/*AndroidTestApp.csproj"
        # AssemblyReader tests are flaky on Windows: https://github.com/getsentry/sentry-dotnet/issues/4091
        - "**/*Sentry.Android.AssemblyReader.Tests.csproj"
        - "**/*DeviceTests*.csproj"
        - "**/*Sentry.Maui.Device.TestApp.csproj"
        - "**/*Sentry.Samples.Android.csproj"
        - "**/*OpenTelemetry.AspNet.csproj"

  - outputPath: Sentry-CI-Build-Windows-arm64.slnf
    include:
      groups:
        - "allProjects"
      patterns:
        - "modules/perfview/**/TraceEvent.csproj"
        - "modules/perfview/**/FastSerialization.csproj"
    exclude:
      groups:
        - "appSamples"
        - "macOnly"
        - "artefacts"
        - "trimTests"
        - "playwrightTests"
      patterns:
        - "**/*AndroidTestApp.csproj"
        # AssemblyReader tests are flaky on Windows: https://github.com/getsentry/sentry-dotnet/issues/4091
        - "**/*Sentry.Android.AssemblyReader.Tests.csproj"
        - "**/*DeviceTests*.csproj"
        - "**/*Sentry.Maui.Device.TestApp.csproj"
        - "**/*Sentry.Samples.Android.csproj"
        - "**/*OpenTelemetry.AspNet.csproj"
        # Depends on LocalDb or SQLitePCL which are x64
        - "**/*Sentry.DiagnosticSource.IntegrationTests.csproj"
        - "**/*Sentry.DiagnosticSource.Tests.csproj"
        - "**/*Sentry.EntityFramework.Tests.csproj"

  - outputPath: Sentry-CI-Build-Samples-macOS.slnf
    include:
      groups:
        - "appSamples"

  # The app samples the Linux build leg built before they moved to their own job
  - outputPath: Sentry-CI-Build-Samples-Linux.slnf
    include:
      patterns:
        - "**/Sentry.Samples.Android.csproj"
        - "**/Sentry.Samples.Maui.csproj"

  - outputPath: Sentry-CI-IntegrationTest-macOS.slnf
    include:
      groups:
        - "integrationTestPackages"

  - outputPath: Sentry-CI-IntegrationTest.slnf
    include:
      groups:
        - "integrationTestPackages"
    exclude:
      groups:
        - "macOnly"

  - outputPath: Sentry-CI-CodeQL.slnf
    include:
      groups:
        - "allProjects"
    exclude:
      groups:
          - "artefacts"
      patterns:
        - "**/Sentry.Bindings*.csproj"
        - "benchmarks/**/*.csproj"
        - "samples/**/*.csproj"
        - "test/**/*.csproj"

  - outputPath: SentryAspNetCore.slnf
    solution: .generated.NoMobile.slnx
    include:
      patterns:
        - "**/*AspNetCore*.csproj"
        - "**/Sentry.DiagnosticSource.csproj"
        - "**/Sentry.Extensions.Logging.csproj"
        - "**/Sentry.Extensions.Logging.Tests.csproj"
        - "**/Sentry.OpenTelemetry.csproj"
        - "**/Sentry.Serilog.csproj"
        - "**/Sentry.csproj"
        - "**/Sentry.Analyzers.csproj"
        - "**/Sentry.Hangfire.csproj"
        - "**/Sentry.Quartz.csproj"
        - "**/Sentry.Samples.Hangfire.csproj"
        - "**/Sentry.Testing.csproj"
        - "**/Sentry.Testing.CrashableApp.csproj"
        - "**/Sentry.Tests.csproj"
        - "**/Sentry.Analyzers.Tests.csproj"

  - outputPath: SentryCore.slnf
    solution: .generated.NoMobile.slnx
    include:
      patterns:
        - "**/Sentry.Benchmarks.csproj"
        - "**/Sentry.Samples.Console.Basic.csproj"
        - "**/Sentry.Samples.Console.Profiling.csproj"
        - "**/Sentry.Profiling.csproj"
        - "**/Sentry.csproj"
        - "**/Sentry.Analyzers.csproj"
        - "**/Sentry.Profiling.Tests.csproj"
        - "**/Sentry.Testing.csproj"
        - "**/Sentry.Testing.CrashableApp.csproj"
        - "**/Sentry.Tests.csproj"
        - "**/Sentry.Analyzers.Tests.csproj"

  - outputPath: SentryDiagnosticSource.slnf
    solution: .generated.NoMobile.slnx
    include:
      patterns:
        - "**/*DiagnosticSource*.csproj"
        - "**/Sentry.csproj"
        - "**/Sentry.Analyzers.csproj"
        - "**/Sentry.Extensions.Logging.csproj"
        - "**/Sentry.Testing.csproj"
        - "**/Sentry.Testing.CrashableApp.csproj"
        - "**/Sentry.Tests.csproj"
        - "**/Sentry.Analyzers.Tests.csproj"

  - outputPath: SentryMobile.slnf
    include:
      patterns:
        - "samples/**/*Android.csproj"
        - "samples/**/*Ios.csproj"
        - "samples/**/*MacCatalyst.csproj"
        - "samples/**/*Maui.csproj"
        - "src/**/Sentry.csproj"
        - "src/**/Sentry.Analyzers.csproj"
        - "src/**/Sentry.Compiler.Extensions.csproj"
        - "src/**/*Android*.csproj"
        - "src/**/*Bindings.Android.csproj"
        - "src/**/*Bindings.Cocoa.csproj"
        - "src/**/Sentry.Extensions.Logging.csproj"
        - "src/**/Sentry.Maui.csproj"
        - "src/**/Sentry.Maui.CommunityToolkit.Mvvm.csproj"
        - "test/**/Sentry.Testing.CrashableApp.csproj"
        - "test/**/Sentry.Android.AssemblyReader.Tests.csproj"
        - "test/**/Sentry.Extensions.Logging.Tests.csproj"
        - "test/**/Sentry.Maui.Device.TestApp.csproj"
        - "test/**/Sentry.Testing.CrashableApp.csproj"
        - "test/**/Sentry.Maui.Tests.csproj"
        - "test/**/Sentry.Testing.csproj"
        - "test/**/Sentry.Tests.csproj"
        - "src/**/Sentry.Analyzers.Tests.csproj"

  - outputPath: SentryNoMobile.slnf
    solution: .generated.NoMobile.slnx
    include:
      groups:
        - "allProjects"
    exclude:
      groups:
        - "artefacts"
        - "trimTests"
        - "mobileOnly"
      patterns:
        - "**/*Bindings*.csproj"
        - "**/*Android*.csproj"
        - "**/*Ios*.csproj"
        - "**/*Maui*.csproj"

  - outputPath: SentryNoSamples.slnf
    include:
      groups:
        - "allProjects"
    exclude:
      groups:
        - "trimTests"
      patterns:
        - "samples/**/*"
        - "**/*Bindings*"
        - "**/*DeviceTests*"
        - "**/*TestApp*"
